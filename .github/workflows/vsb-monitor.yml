# Scheduled monitoring of the official VSB examination notices (runs the SAME cycle as the server: discover -> download ->
# validate -> parse -> index -> notify -> optional Supabase mirror).
#
# IMPORTANT - what this workflow is and is not:
#   * It keeps a monitoring state, e-mails watchers, and mirrors records to Supabase (if the secrets are set).
#   * It does NOT host the student website. GitHub Pages serves static files only and cannot run the Python backend.
#     Host the backend (Windows PC, VPS or Docker, see docs/DEPLOYMENT.md) for the student search and page images.
#   * GitHub's cron is best effort (runs can be delayed; the shortest useful interval is about 15 minutes).
#   * State is kept with actions/cache. GitHub evicts caches unused for 7 days; with this schedule that does not happen,
#     and if it does the workflow simply re-discovers and re-downloads everything (nothing is lost, only re-processed).
name: VSB exam monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Re-parse every stored PDF and rebuild the index"
        type: boolean
        default: false

concurrency:
  group: vsb-monitor
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ENVIRONMENT: production
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DATABASE_URL: sqlite:///${{ github.workspace }}/.monitor-state/exam_monitor.db
      DOCUMENT_STORAGE_DIR: ${{ github.workspace }}/.monitor-state/documents
      LOG_DIR: ${{ github.workspace }}/.monitor-state/logs
      SCHEDULER_ENABLED: "false"
      VSB_AUTO_DISCOVER_ENABLED: "true"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Tesseract (OCR fallback for scanned PDFs)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr

      - name: Check that the required secret exists
        run: |
          if [ -z "$SECRET_KEY" ]; then echo "::error::Set the repository secret SECRET_KEY (python -m app.cli gen-secret)"; exit 1; fi

      - name: Restore monitoring state
        uses: actions/cache/restore@v4
        with:
          path: .monitor-state
          key: vsb-state-${{ github.run_id }}
          restore-keys: vsb-state-

      - run: pip install -r backend/requirements.txt

      - name: Prepare state folders and database
        working-directory: backend
        run: |
          mkdir -p ../.monitor-state/documents ../.monitor-state/logs
          python -m app.cli migrate

      - name: Run one monitoring cycle
        id: cycle
        working-directory: backend
        run: python -m app.cli run-cycle ${{ inputs.rebuild && '--rebuild' || '' }} | tee ../.monitor-state/last-cycle.json

      - name: Save monitoring state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .monitor-state
          key: vsb-state-${{ github.run_id }}

      - name: Keep logs when the cycle failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vsb-monitor-logs
          path: .monitor-state/last-cycle.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Report the failure as an issue (at most one open at a time)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --state open --label vsb-monitor --json number --jq '.[0].number' || true)
          body="The scheduled VSB monitoring cycle failed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ -n "$existing" ]; then gh issue comment "$existing" --body "$body"; else gh issue create --title "VSB monitor: scan failed" --label vsb-monitor --body "$body" || gh issue create --title "VSB monitor: scan failed" --body "$body"; fi
